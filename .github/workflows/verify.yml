name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check API contract
        run: npm run contract:check

      - name: Run tests
        run: npm test

      - name: Type-check tests
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Demo Service checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo-service/pom.xml

      - name: Allow Maven Wrapper to execute
        run: chmod +x demo-service/mvnw

      - name: Verify Demo Service
        run: ./demo-service/mvnw -f demo-service/pom.xml clean verify
